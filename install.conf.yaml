- clean: []
- create:
    - ~/.config/ghostty
    - ~/.ssh
    - ~/.claude/skills
    - ~/.claude/bin
    - ~/.config/mise
    - ~/.vscode/extensions
- link:
    ~/.config/ghostty/config: ghostty/config
    ~/.config/mise/config.toml:
        path: mise/config.toml
        force: true
    ~/.ssh/config: .ssh/config
    ~/.claude/CLAUDE.md: agents/AGENTS.md
    ~/.claude/settings.json: agents/claude-settings.json
    ~/.claude/bin/comment-guard:
        path: agents/bin/comment-guard-2f934a0
        relink: true
    ~/.claude/skills/ask: agents/skills/ask
    ~/.claude/skills/blast-radius: agents/skills/blast-radius
    ~/.claude/skills/build: agents/skills/build
    ~/.claude/skills/commit: agents/skills/commit
    ~/.claude/skills/elixir-ecto-explain-query: agents/skills/elixir-ecto-explain-query
    ~/.claude/skills/git-ai-search: agents/skills/git-ai-search
    ~/.claude/skills/html-doc: agents/skills/html-doc
    ~/.claude/skills/prompt-analysis: agents/skills/prompt-analysis
    ~/.claude/skills/pr-review-comments: agents/skills/pr-review-comments
    ~/.claude/skills/simplify-docs: agents/skills/simplify-docs
    ~/.claude/skills/whut: agents/skills/whut
    ~/.vscode/extensions/duvel-theme: vscode/duvel
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - ['[ -f ~/.ssh/config.local ] || cp .ssh/config.local ~/.ssh/config.local', Seeding local SSH config]
    - command: 'if command -v mise >/dev/null 2>&1; then mise install; else echo "warning: mise not found on PATH, skipping tool install (see https://mise.jdx.dev)"; fi'
      description: Installing mise-managed tools
      stderr: true
      stdout: true
